<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Translation</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}
body {
    background: lightgreen;
    font-family: Arial, sans-serif;
}
#captions {
    position: fixed;
    bottom: 0;
    left: 3%;
    width: 94%;
    text-align: center;
    overflow-wrap: break-word;
    color: white;
    font-size: 40pt;
    font-weight: 900;
    text-shadow: 2px 2px 3px black;
}
</style>
</head>

<body>
<div id="captions"></div>

<script>
"use strict";

const params = new URLSearchParams(location.search);
const captions = document.getElementById("captions");

document.body.style.backgroundColor =
    params.get("bgcolor") || "lightgreen";

captions.style.color = params.get("color") || "white";
captions.style.fontSize =
    (Number(params.get("size")) || 40) + "pt";
captions.style.fontWeight = params.get("weight") || "900";

if (params.get("font")) {
    captions.style.fontFamily = params.get("font");
}

if (params.get("v_align") === "top") {
    captions.style.bottom = "auto";
    captions.style.top = "0";
}

const SpeechAPI =
    window.SpeechRecognition || window.webkitSpeechRecognition;

const key = params.get("gs_key");

if (!SpeechAPI) {
    captions.textContent = "Please open this page in Google Chrome.";
} else if (!key) {
    captions.textContent = "Missing gs_key in the page URL.";
} else {
    startCaptions();
}

function startCaptions() {
    const recognition = new SpeechAPI();
    recognition.lang = params.get("recog") || "en-US";
    recognition.interimResults = true;
    recognition.continuous = true;

    const source = recognition.lang.split("-")[0];
    const target = params.get("trans") || "es";
    const endpoint =
        "https://script.google.com/macros/s/" +
        encodeURIComponent(key) + "/exec";

    let pending = "";
    let lastSent = "";
    let lastStarted = 0;
    let busy = false;
    let stopped = false;
    let retryAfter = 0;

    async function translatePending() {
        if (busy || !pending || pending === lastSent) return;

        const now = Date.now();

        // Start requests no more frequently than every 600 ms.
        if (now < retryAfter || now - lastStarted < 600) return;

        const text = pending;
        pending = "";
        lastStarted = now;
        busy = true;

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const started = performance.now();

        try {
            const query = new URLSearchParams({
                text,
                source,
                target
            });

            const response = await fetch(endpoint + "?" + query, {
                signal: controller.signal
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const translated = await response.text();

            if (/^\s*(<!doctype|<html)/i.test(translated)) {
                throw new Error("Google returned an HTML error page.");
            }

            captions.textContent = translated;
            lastSent = text;

            console.log(
                "TRANSLATION:",
                Math.round(performance.now() - started) + " ms",
                text,
                "→",
                translated
            );
        } catch (error) {
            console.error("Translation failed:", error);
            if (!pending) pending = text;
            retryAfter = Date.now() + 3000;
        } finally {
            clearTimeout(timeout);
            busy = false;
        }
    }

    recognition.onresult = function (event) {
        let text = "";
        let partial = false;

        for (let i = event.resultIndex; i < event.results.length; i++) {
            text += event.results[i][0].transcript + " ";
            if (!event.results[i].isFinal) partial = true;
        }

        text = text.trim();
        if (!text) return;

        console.log(partial ? "PARTIAL:" : "FINAL:", text);

        pending = text;
        translatePending();
    };

    recognition.onerror = function (event) {
        console.warn("Speech recognition:", event.error);

        if (["not-allowed", "service-not-allowed", "audio-capture"]
            .includes(event.error)) {
            stopped = true;
            captions.textContent =
                "Check Chrome microphone permission and input device.";
        }
    };

    recognition.onend = function () {
        if (!stopped) setTimeout(startRecognition, 300);
    };

    function startRecognition() {
        try {
            recognition.start();
        } catch (error) {
            console.warn("Could not start recognition:", error);
        }
    }

    setInterval(translatePending, 250);
    startRecognition();
}
</script>
</body>
</html>

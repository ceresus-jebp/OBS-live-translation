<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Spanish Captions</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: lightgreen;
            font-family: Arial, sans-serif;
        }

        #captions {
            position: fixed;
            bottom: 5%;
            left: 5%;
            width: 90%;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 32pt;
            font-weight: 900;
            line-height: 1.35;
            overflow-wrap: break-word;
        }

        #captionText {
            background-color: black;
            padding: 2px 10px;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }

        #captionText:empty {
            padding: 0;
            background: transparent;
        }

        #start {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            padding: 16px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button id="start">Start Spanish captions</button>

    <div id="captions">
        <span id="captionText"></span>
    </div>

    <script>
        "use strict";

        const params = new URLSearchParams(location.search);
        const captions = document.getElementById("captions");
        const captionText = document.getElementById("captionText");
        const button = document.getElementById("start");

        document.body.style.backgroundColor =
            params.get("bgcolor") || "lightgreen";

        captions.style.color = params.get("color") || "white";
        captions.style.fontSize =
            (Number(params.get("size")) || 32) + "pt";
        captions.style.fontWeight =
            params.get("weight") || "900";

        if (params.get("font")) {
            captions.style.fontFamily = params.get("font");
        }

        if (params.get("v_align") === "top") {
            captions.style.bottom = "auto";
            captions.style.top = "5%";
        }

        button.onclick = async function () {
            const SpeechAPI =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!SpeechAPI || !("Translator" in window)) {
                button.textContent =
                    "Open this page in Chrome with Translator support.";
                return;
            }

            button.disabled = true;
            button.textContent = "Preparing English → Spanish...";

            try {
                const translator = await Translator.create({
                    sourceLanguage: "en",
                    targetLanguage: "es",

                    monitor(monitor) {
                        monitor.addEventListener(
                            "downloadprogress",
                            function (event) {
                                button.textContent =
                                    "Downloading: " +
                                    Math.round(event.loaded * 100) +
                                    "%";
                            }
                        );
                    }
                });

                const recognition = new SpeechAPI();

                recognition.lang = "en-US";

                // Translate completed phrases to avoid word-by-word changes.
                recognition.interimResults = false;
                recognition.continuous = true;

                const queue = [];
                const processed = new Set();

                let busy = false;
                let stopped = false;
                let session = 0;

                async function processQueue() {
                    if (busy || stopped) return;

                    busy = true;

                    try {
                        while (queue.length && !stopped) {
                            const text = queue.shift();
                            const started = performance.now();

                            try {
                                const translated =
                                    await translator.translate(text);

                                captionText.textContent = translated;

                                console.log(
                                    "ENGLISH:",
                                    text,
                                    "| SPANISH:",
                                    translated,
                                    "| Translation:",
                                    Math.round(
                                        performance.now() - started
                                    ) + " ms"
                                );
                            } catch (error) {
                                console.error(
                                    "Local translation failed:",
                                    error
                                );
                            }
                        }
                    } finally {
                        busy = false;
                    }
                }

                recognition.onresult = function (event) {
                    for (
                        let i = event.resultIndex;
                        i < event.results.length;
                        i++
                    ) {
                        if (!event.results[i].isFinal) continue;

                        const id = session + ":" + i;

                        if (processed.has(id)) continue;

                        const text =
                            event.results[i][0].transcript.trim();

                        if (!text) continue;

                        processed.add(id);
                        queue.push(text);
                    }

                    processQueue();
                };

                recognition.onerror = function (event) {
                    console.warn(
                        "Speech recognition:",
                        event.error
                    );

                    if (
                        [
                            "not-allowed",
                            "service-not-allowed",
                            "audio-capture"
                        ].includes(event.error)
                    ) {
                        stopped = true;
                        button.hidden = false;
                        button.textContent =
                            "Check microphone permissions, then reload.";
                    }
                };

                recognition.onend = function () {
                    if (stopped) return;

                    session++;
                    processed.clear();

                    setTimeout(function () {
                        try {
                            recognition.start();
                        } catch (error) {
                            console.error(
                                "Could not restart recognition:",
                                error
                            );

                            button.hidden = false;
                            button.textContent =
                                "Recognition stopped. Reload to restart.";
                        }
                    }, 300);
                };

                recognition.start();
                button.hidden = true;

            } catch (error) {
                console.error(error);

                button.textContent =
                    "Could not start. Click to retry.";
                button.disabled = false;
            }
        };
    </script>
</body>
</html>

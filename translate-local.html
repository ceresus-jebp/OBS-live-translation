<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local Spanish Captions</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: lightgreen;
    font-family: Arial, sans-serif;
}

#captions {
    position: fixed;
    bottom: 0;
    left: 3%;
    width: 94%;
    color: white;
    text-align: center;
    font-size: 40pt;
    font-weight: 900;
    overflow-wrap: break-word;
    text-shadow: 2px 2px 3px black;
}

#start {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 16px;
    font-size: 18px;
}
</style>
</head>

<body>
<button id="start">Start Spanish captions</button>
<div id="captions"></div>

<script>
"use strict";

const params = new URLSearchParams(location.search);
const captions = document.getElementById("captions");
const button = document.getElementById("start");

document.body.style.backgroundColor =
    params.get("bgcolor") || "lightgreen";

captions.style.color = params.get("color") || "white";
captions.style.fontSize =
    (Number(params.get("size")) || 40) + "pt";
captions.style.fontWeight = params.get("weight") || "900";

if (params.get("font")) {
    captions.style.fontFamily = params.get("font");
}

if (params.get("v_align") === "top") {
    captions.style.bottom = "auto";
    captions.style.top = "0";
}

button.onclick = async function () {
    const SpeechAPI =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechAPI || !("Translator" in window)) {
        button.textContent =
            "Use Chrome with Translator API support.";
        return;
    }

    button.disabled = true;
    button.textContent = "Preparing English → Spanish...";

    try {
        const translator = await Translator.create({
            sourceLanguage: "en",
            targetLanguage: "es",
            monitor(m) {
                m.addEventListener("downloadprogress", e => {
                    button.textContent =
                        "Downloading: " +
                        Math.round(e.loaded * 100) + "%";
                });
            }
        });

        const recognition = new SpeechAPI();
        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.continuous = true;

        const queue = [];
        const processed = new Set();

        let busy = false;
        let stopped = false;
        let session = 0;

        async function processQueue() {
            if (busy || stopped) return;
            busy = true;

            try {
                while (queue.length && !stopped) {
                    const text = queue.shift();
                    const started = performance.now();

                    try {
                        const result =
                            await translator.translate(text);

                        captions.textContent = result;

                        console.log(
                            "FINAL ENGLISH:", text,
                            "| SPANISH:", result,
                            "| Translation:",
                            Math.round(
                                performance.now() - started
                            ) + " ms"
                        );
                    } catch (error) {
                        console.error(
                            "Local translation failed:",
                            error
                        );
                    }
                }
            } finally {
                busy = false;
            }
        }

        recognition.onresult = function (event) {
            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {
                // Ignore unfinished speech.
                if (!event.results[i].isFinal) continue;

                const id = session + ":" + i;
                if (processed.has(id)) continue;

                const text =
                    event.results[i][0].transcript.trim();

                if (!text) continue;

                processed.add(id);
                queue.push(text);
            }

            processQueue();
        };

        recognition.onerror = function (event) {
            console.warn(
                "Speech recognition:",
                event.error
            );

            if ([
                "not-allowed",
                "service-not-allowed",
                "audio-capture"
            ].includes(event.error)) {
                stopped = true;
                button.hidden = false;
                button.textContent =
                    "Check microphone permissions, then reload.";
            }
        };

        recognition.onend = function () {
            if (stopped) return;

            session++;
            processed.clear();

            setTimeout(() => {
                try {
                    recognition.start();
                } catch (error) {
                    console.error(
                        "Could not restart recognition:",
                        error
                    );
                    button.hidden = false;
                    button.textContent =
                        "Recognition stopped. Reload to restart.";
                }
            }, 300);
        };

        recognition.start();
        button.hidden = true;

    } catch (error) {
        console.error(error);
        button.textContent =
            "Could not start. Click to retry.";
        button.disabled = false;
    }
};
</script>
</body>
</html>

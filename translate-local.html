<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local Spanish Captions</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}
body {
    background: lightgreen;
    font-family: Arial, sans-serif;
}
#captions {
    position: fixed;
    bottom: 0;
    left: 3%;
    width: 94%;
    color: white;
    text-align: center;
    font-size: 40pt;
    font-weight: 900;
    overflow-wrap: break-word;
    text-shadow: 2px 2px 3px black;
}
#start {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 16px;
    font-size: 18px;
}
</style>
</head>
<body>
<button id="start">Start Spanish captions</button>
<div id="captions"></div>

<script>
"use strict";

const params = new URLSearchParams(location.search);
const captions = document.getElementById("captions");
const button = document.getElementById("start");

document.body.style.backgroundColor =
    params.get("bgcolor") || "lightgreen";
captions.style.color = params.get("color") || "white";
captions.style.fontSize =
    (Number(params.get("size")) || 40) + "pt";
captions.style.fontWeight = params.get("weight") || "900";

if (params.get("v_align") === "top") {
    captions.style.bottom = "auto";
    captions.style.top = "0";
}

button.onclick = async function () {
    const SpeechAPI =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechAPI || !("Translator" in window)) {
        button.textContent = "Use Chrome with Translator API support.";
        return;
    }

    button.disabled = true;
    button.textContent = "Preparing English → Spanish...";

    try {
        const translator = await Translator.create({
            sourceLanguage: "en",
            targetLanguage: "es",
            monitor(m) {
                m.addEventListener("downloadprogress", e => {
                    button.textContent =
                        "Downloading: " + Math.round(e.loaded * 100) + "%";
                });
            }
        });

        const recognition = new SpeechAPI();
        recognition.lang = "en-US";
        recognition.interimResults = true;
        recognition.continuous = true;

        let pending = null;
        let busy = false;
        let stopped = false;
        let timer = null;
        let lastStarted = 0;
        let lastKey = "";

        // Keep the newest version of each phrase.
        const phrases = new Map();
        let session = 0;

        function schedule() {
            if (timer || busy || !pending || stopped) return;

            const wait = Math.max(
                0, 200 - (performance.now() - lastStarted)
            );

            timer = setTimeout(() => {
                timer = null;
                translatePending();
            }, wait);
        }

        async function translatePending() {
            if (busy || !pending || stopped) return;

            const job = pending;
            pending = null;
            const jobKey = job.id + ":" + job.text;

            if (jobKey === lastKey) {
                schedule();
                return;
            }

            busy = true;
            lastStarted = performance.now();

            try {
                const result = await translator.translate(job.text);

                // A newer phrase must not be replaced by an older one.
                if (!pending || pending.id === job.id) {
                    captions.textContent = result;
                }

                lastKey = jobKey;
                console.log(
                    "LOCAL:",
                    Math.round(performance.now() - lastStarted) + " ms",
                    result
                );
            } catch (error) {
                console.error("Local translation failed:", error);
            } finally {
                busy = false;
                schedule();
            }
        }

        recognition.onresult = function (event) {
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const text = event.results[i][0].transcript.trim();
                if (!text) continue;

                const id = session + ":" + i;
                phrases.set(id, text);
                pending = { id, text };
            }

            // Limit stored phrase history.
            while (phrases.size > 20) {
                phrases.delete(phrases.keys().next().value);
            }

            schedule();
        };

        recognition.onerror = function (event) {
            console.warn("Speech recognition:", event.error);

            if (["not-allowed", "service-not-allowed", "audio-capture"]
                .includes(event.error)) {
                stopped = true;
                button.hidden = false;
                button.textContent =
                    "Check microphone permissions, then reload.";
            }
        };

        recognition.onend = function () {
            if (!stopped) {
                session++;
                setTimeout(() => {
                    try {
                        recognition.start();
                    } catch (error) {
                        console.error(error);
                    }
                }, 300);
            }
        };

        recognition.start();
        button.hidden = true;
    } catch (error) {
        console.error(error);
        button.textContent = "Could not start. Click to retry.";
        button.disabled = false;
    }
};
</script>
</body>
</html>
